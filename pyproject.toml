[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "atari-room-editor"
version = "1.0.0"
description = "Atari 8-bit ANTIC 4 Room Editor with PySide6 GUI"
requires-python = ">=3.14"
dependencies = [
    "PySide6>=6.10.0",
    "PyYAML>=6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
room-editor = "room_editor.main:main"

[tool.setuptools.packages.find]
include = ["room_editor*"]

[tool.setuptools.package-data]
room_editor = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests", "room_editor/tests"]
